<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — {{ siteTitle }}</title>
</head>
<body>
  <header>
    <p><a href="{{ siteUrl }}">{{ siteTitle }}</a></p>
  </header>

  <main>
    <h1>{{ title }}</h1>
    {{{ itemBody }}}
  </main>

  <footer>
    <p>&copy; {{ siteAuthor }}</p>
  </footer>
</body>
</html>
